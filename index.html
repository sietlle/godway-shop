<!-- CART -->

<div
    class="cart-overlay"
    id="cartOverlay"
    onclick="closeCart(event)"
>

    <div
        class="cart-panel"
        onclick="event.stopPropagation()"
    >

        <div class="cart-head">

            <h2>
                КОРЗИНА
            </h2>

            <button
                class="close-cart"
                onclick="closeCart()"
            >
                ×
            </button>

        </div>

        <div
            class="cart-items"
            id="cartItems"
        ></div>

        <div class="cart-bottom">

            <div class="total">

                <span>
                    ИТОГО
                </span>

                <span id="cartTotal">
                    0 ₽
                </span>

            </div>

            <button
                class="checkout"
                onclick="checkout()"
            >
                ОФОРМИТЬ ЗАКАЗ
            </button>

        </div>

    </div>

</div>

<script>

/* CART */

let cart = [];

try {
    cart = JSON.parse(
        localStorage.getItem("godwayCart")
    ) || [];
} catch (error) {
    cart = [];
}

function saveCart() {

    localStorage.setItem(
        "godwayCart",
        JSON.stringify(cart)
    );

}

function addToCart(name, price) {

    const existing = cart.find(
        item => item.name === name
    );

    if (existing) {

        existing.quantity += 1;

    } else {

        cart.push({
            name: name,
            price: price,
            quantity: 1
        });

    }

    saveCart();
    updateCart();
    openCart();

}

function changeQuantity(index, amount) {

    if (!cart[index]) return;

    cart[index].quantity += amount;

    if (cart[index].quantity <= 0) {

        cart.splice(index, 1);

    }

    saveCart();
    updateCart();

}

function removeItem(index) {

    if (!cart[index]) return;

    cart.splice(index, 1);

    saveCart();
    updateCart();

}

function updateCart() {

    const cartItems =
        document.getElementById("cartItems");

    const cartCount =
        document.getElementById("cartCount");

    const cartTotal =
        document.getElementById("cartTotal");

    let count = 0;
    let total = 0;

    cart.forEach(item => {

        count += item.quantity;

        total +=
            item.price *
            item.quantity;

    });

    cartCount.textContent = count;

    cartTotal.textContent =
        total.toLocaleString("ru-RU") + " ₽";

    if (cart.length === 0) {

        cartItems.innerHTML =
            '<div class="cart-empty">Корзина пока пуста</div>';

        return;

    }

    cartItems.innerHTML = cart.map(
        (item, index) => {

            return `

            <div class="cart-item">

                <div>

                    <div class="cart-item-name">
                        ${item.name}
                    </div>

                    <div class="cart-item-price">
                        ${item.price.toLocaleString("ru-RU")} ₽
                    </div>

                    <div class="quantity">

                        <button
                            onclick="changeQuantity(${index}, -1)"
                        >
                            −
                        </button>

                        <span>
                            ${item.quantity}
                        </span>

                        <button
                            onclick="changeQuantity(${index}, 1)"
                        >
                            +
                        </button>

                    </div>

                    <button
                        class="remove"
                        onclick="removeItem(${index})"
                    >
                        Удалить
                    </button>

                </div>

            </div>

            `;

        }
    ).join("");

}

function openCart() {

    document
        .getElementById("cartOverlay")
        .classList.add("active");

}


function closeCart(event) {

    if (
        event &&
        event.target &&
        event.target.id !== "cartOverlay"
    ) {
        return;
    }

    document
        .getElementById("cartOverlay")
        .classList.remove("active");

}

function checkout() {

    if (cart.length === 0) {

        alert("Корзина пуста");

        return;

    }

    alert(
        "Оформление заказа подключим следующим этапом."
    );

}

/* CATALOG FILTER */

function filterProducts(category, button) {

    const products =
        document.querySelectorAll(".product");

    const buttons =
        document.querySelectorAll(".category");

    buttons.forEach(item => {
        item.classList.remove("active");
    });

    button.classList.add("active");

    products.forEach(product => {

        if (
            category === "all" ||
            product.dataset.category === category
        ) {

            product.classList.remove("hidden");

        } else {

            product.classList.add("hidden");

        }

    });

}

/* START */

updateCart();

</script>
